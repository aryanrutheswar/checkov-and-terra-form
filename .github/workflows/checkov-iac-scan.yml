name: "Checkov IaC Security Gate"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    # Daily scheduled scan at 02:00 UTC
    - cron: "0 2 * * *"

permissions:
  contents: read
  security-events: write # Required for uploading SARIF to GitHub Security tab
  actions: read
  pull-requests: write

jobs:
  checkov-scan:
    name: "Static Analysis & Policy Enforcement"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          pip install checkov

      - name: Execute Checkov Security Scan (Remediated Suite)
        id: checkov_remediated
        run: |
          mkdir -p reports
          checkov \
            --directory ./terraform/remediated \
            --external-checks-dir ./custom_policies/yaml \
            --external-checks-dir ./custom_policies/python \
            --framework terraform \
            --output cli \
            --output sarif \
            --output-file-path ./reports \
            --hard-fail-on HIGH \
            --soft-fail false
        continue-on-error: false

      - name: Execute Checkov Security Scan (Vulnerable Suite - Audit Only)
        id: checkov_audit
        if: always()
        run: |
          checkov \
            --directory ./terraform/vulnerable \
            --framework terraform \
            --output cli \
            --soft-fail true

      - name: Upload Scan Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-security-reports
          path: ./reports/

      - name: Publish SARIF to GitHub Code Scanning Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ./reports/results_sarif.sarif
          category: checkov-iac-scan
